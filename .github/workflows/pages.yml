name: PIM Estoque Web

on:
  push:
    branches: [main, feat/flutter-mobile-novembro-2026]
    paths: ['mobile/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pim-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --base-href /Sistema-Controle-Estoque/ --no-web-resources-cdn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
