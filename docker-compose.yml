# Ambiente de DESENVOLVIMENTO/DEMONSTRAÇÃO: senhas e chave JWT abaixo são exemplos públicos.
# Para outro uso, defina MSSQL_SA_PASSWORD e JWT_KEY no ambiente ou em um arquivo .env fora do Git.
# Uso: docker compose up --build  →  painel em http://localhost:8080 (admin@fixar.com.br / Admin@123)

x-sa-password: &sa-password ${MSSQL_SA_PASSWORD:-Dev_Somente_Local#2026}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sa-password
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Execução única: cria o banco e aplica database/0*.sql em ordem (scripts são reexecutáveis).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: *sa-password
    volumes:
      - ./database:/database:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        sql() { /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b "$$@"; }
        sql -Q "IF DB_ID('PimEstoque') IS NULL CREATE DATABASE PimEstoque"
        for f in /database/0*.sql; do echo "Aplicando $$f"; sql -d PimEstoque -i "$$f"; done
    restart: "no"

  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PimEstoque;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Somente_Local#2026};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:-chave-docker-somente-desenvolvimento-0123456789abcdef}
      Seed__AdminEmail: admin@fixar.com.br
      Seed__AdminSenha: Admin@123
    ports:
      - "127.0.0.1:8080:8080"  # somente local; credenciais do compose são de demonstração

volumes:
  mssql-data:
